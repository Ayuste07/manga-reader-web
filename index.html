<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- Sin user-scalable=no: el zoom con dos dedos es el nativo de Safari (el más fluido). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Manga</title>
  <meta name="description" content="Lector de manga en PDF con scroll vertical continuo.">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="color-scheme" content="dark">

  <!-- Modo app en iPhone (Añadir a pantalla de inicio) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Manga">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="library" class="library">
    <header class="lib-header">
      <h1>Biblioteca</h1>
      <label class="icon-btn primary" aria-label="Importar PDF">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        <input id="file-input" type="file" accept="application/pdf,.pdf" multiple hidden>
      </label>
    </header>

    <div id="install-hint" class="install-hint" hidden>
      <strong>Instálala como app:</strong> en Safari pulsa <em>Compartir</em> → <em>Añadir a pantalla de inicio</em>.
      Así se abre a pantalla completa y tus mangas quedan guardados.
      <button class="link-btn" id="install-hint-close" type="button">Entendido</button>
    </div>

    <section id="continue"></section>
    <section id="grid" class="grid"></section>

    <div id="empty" class="empty" hidden>
      <svg viewBox="0 0 48 48" width="56" height="56" aria-hidden="true"><rect x="9" y="5" width="30" height="16" rx="2" fill="currentColor" opacity=".9"/><rect x="9" y="25" width="30" height="18" rx="2" fill="currentColor" opacity=".5"/></svg>
      <h2>Tu biblioteca está vacía</h2>
      <p>Importa un PDF de manga desde Archivos. Se guarda solo en este iPhone.</p>
      <label class="btn-primary">Importar PDF<input type="file" accept="application/pdf,.pdf" multiple hidden class="file-input-alt"></label>
    </div>
  </main>

  <div id="reader-root"></div>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
